# doc-store delivery and production acceptance.

project:
  version_sources: discover and verify from current project configuration before release
  build: discover and verify the canonical build or release entrypoint before use
  build_execution: >-
    Whatever entrypoint `build` resolves to, it ALWAYS runs on the LOCAL host, from
    the LOCAL checkout, via local shell — never via MCP Proxy, never via the MCP
    Terminal sandbox/host-exec. Only the subsequent deploy step touches deploy_host.
  deploy_host: discover from current project configuration and verify current user authorization
  live_pipeline: discover and verify the single canonical real-server acceptance pipeline before use
  production_servers: [doc-store-vvz]
  checks: [pytest, 'ruff check .', 'mypy .']
  deploy_target_excluded_scope: >-
    this project's own live doc-store database on the deployment target - a
    bugfix-cycle deploy exercises the discovered live pipeline against the
    deployed doc-store-vvz service but MUST NEVER write test/throwaway data
    into or otherwise mutate the production doc-store database; use an
    isolated test database/schema for pipeline checks that need write access

procedure:
  - reproduce the defect against the relevant current surface
  - identify and prove the root cause before mutation
  - implement the localized repair and focused regression test
  - run focused tests, pytest, ruff check ., and mypy .
  - discover and verify the current release mechanics; stop instead of guessing
  - increment and align every version source
  - run the discovered canonical build or release entrypoint LOCALLY from the active
    working branch (see `build_execution`)
  - deploy the built artifact only to the discovered and currently authorized target;
    scope is everything EXCEPT deploy_target_excluded_scope - never touch it
  - run the discovered single canonical real-server acceptance pipeline against production
  - verify registration, health, version, and changed behavior through MCP Proxy
  - create and verify the Plan Manager fix, then close only the proven bug
  - merge the verified working branch into local main, push it, and verify the remote ref
  - CAS pulls that commit, verifies it, merges main into cas, and remains on cas

invariants:
  - exactly one real-server pipeline; extend it instead of adding another
  - queue handoff is normal; selected client mode determines polling or messages
  - completed queue state is not success until the inner result is checked
  - do not deploy from or edit main before production verification
  - never force-push or rewrite published history; stop and report an exact push/pull failure
  - release mechanics are current-project facts to discover and verify, never prompt defaults to invent
  - build script execution locus is LOCAL (see `build_execution`); only the deploy
    target and production verification touch deploy_host
